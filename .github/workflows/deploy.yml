name: Deploy Fellowship Tracker

on:
  push:
    branches: [main]

jobs:
  docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    env:
      IMAGE_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
    strategy:
      matrix:
        include:
          - image: api
            dockerfile: Dockerfile.api
          - image: scraper
            dockerfile: Dockerfile.scraper
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/fellowship-tracker-${{ matrix.image }}:latest
            ${{ env.IMAGE_NAMESPACE }}/fellowship-tracker-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-infra:
    name: Update image tags in infra
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Update image tag and push
        env:
          PAT: ${{ secrets.INFRA_PAT }}
          IMAGE_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE_TAG="${{ github.sha }}"
          git clone https://x-access-token:${PAT}@github.com/pointblank-club/infra.git infra
          cd infra

          sed -i "s|image: ${IMAGE_NAMESPACE}/fellowship-tracker-api:.*|image: ${IMAGE_NAMESPACE}/fellowship-tracker-api:${IMAGE_TAG}|" \
            argocd/fellowship-tracker/deployment.yaml
          sed -i "s|image: ${IMAGE_NAMESPACE}/fellowship-tracker-scraper:.*|image: ${IMAGE_NAMESPACE}/fellowship-tracker-scraper:${IMAGE_TAG}|" \
            argocd/fellowship-tracker/cronjob.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add argocd/fellowship-tracker/deployment.yaml argocd/fellowship-tracker/cronjob.yaml
          git diff --cached --quiet && echo "No image changes" && exit 0
          git commit -m "chore(fellowship-tracker): update images to ${IMAGE_TAG}"
          git push
